[project]
name = "autocalc-backend"
version = "0.1.0"
description = "AutoCalc KKTC — döviz kuru, akaryakıt fiyatı ve araç katalog proxy/önbellek servisi"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.5",
  "tzdata>=2024.1",  # Windows'ta stdlib zoneinfo IANA veritabanını içermez
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
